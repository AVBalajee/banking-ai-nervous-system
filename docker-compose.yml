version: "3.9"

# ============================================================
# AI-Powered Banking Economic Digital Nervous System
# Full local stack: Kafka, Postgres, Neo4j, AI Engine,
# Event Collector, Prediction Engine, Frontend, Observability
# ============================================================

services:

  # ---------------- Messaging ----------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ---------------- Databases ----------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nervous_system
      POSTGRES_USER: bank_admin
      POSTGRES_PASSWORD: bank_admin_pw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  neo4j:
    image: neo4j:5.20-community
    environment:
      NEO4J_AUTH: neo4j/nervous_system_pw
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    volumes:
      - neo4jdata:/data

  # ---------------- AI Engine (Python/FastAPI/LangChain) ----------------
  ai-engine:
    build: ./ai-engine
    ports:
      - "8500:8500"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=nervous_system_pw
    depends_on:
      - kafka
      - neo4j

  # ---------------- Event Collector (Spring Boot) ----------------
  event-collector:
    build: ./backend/event-collector
    ports:
      - "8081:8081"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nervous_system
      - SPRING_DATASOURCE_USERNAME=bank_admin
      - SPRING_DATASOURCE_PASSWORD=bank_admin_pw
    depends_on:
      - kafka
      - postgres

  # ---------------- Prediction Engine (Spring Boot) ----------------
  prediction-engine:
    build: ./backend/prediction-engine
    ports:
      - "8082:8082"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - AI_ENGINE_URL=http://ai-engine:8500
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nervous_system
      - SPRING_DATASOURCE_USERNAME=bank_admin
      - SPRING_DATASOURCE_PASSWORD=bank_admin_pw
    depends_on:
      - kafka
      - postgres
      - ai-engine

  # ---------------- Frontend (React) ----------------
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8082
      - VITE_AI_ENGINE_URL=http://localhost:8500
    depends_on:
      - prediction-engine
      - ai-engine

  # ---------------- Observability ----------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3001:3000"
    volumes:
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  pgdata:
  neo4jdata:
